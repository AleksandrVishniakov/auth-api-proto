# EasyP configuration file.
# Documentation: https://easyp.tech/docs/guide/introduction/what-is

lint:
  use:
    - DEFAULT

deps:
  - github.com/bufbuild/protoc-gen-validate
  - github.com/googleapis/googleapis

generate:
  inputs:
    - directory: "auth/v1"
  plugins:
    - name: go
      out: ./gen/go
      opts:
        paths: source_relative
    - name: go-grpc
      out: ./gen/go
      opts:
        paths: source_relative
    - name: validate
      out: ./gen/go
      opts:
        paths: source_relative
        lang: "go"
    - name: grpc-gateway
      out: ./gen/go
      opts:
        paths: source_relative
    - name: openapiv2
      out: ./gen/go
      opts:
        simple_operation_ids: false
        generate_unbound_methods: false
