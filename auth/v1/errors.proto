syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AleksandrVishniakov/auth-api-proto/gen/go/auth/v1;authv1";

message Error {
    string status = 1;
    google.protobuf.Timestamp timestamp = 2;
    string request_id = 3;
    optional string message = 4;
    repeated ValidationError validation_errors = 5;
}

message ValidationError {
    string field = 1;
    string reason = 2;
}